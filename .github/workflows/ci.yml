name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dagster
          POSTGRES_PASSWORD: dagster
          POSTGRES_DB: dagster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dagster"
          --health-interval 5s --health-timeout 5s --health-retries 10
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DAGSTER_PG_URL: postgresql://dagster:dagster@localhost:5432/dagster
      S3_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      LANDING_BUCKET: wprdc-etl-landing
      DAGSTER_RUNTIME_BUCKET: wprdc-dagster-runtime

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags since v8
        with:
          version: "0.12.7"
      - run: uv python install 3.11
      - run: uv sync --frozen

      - name: create buckets
        run: |
          uv run --with awscli aws --endpoint-url "$S3_ENDPOINT_URL" s3 mb "s3://$LANDING_BUCKET"
          uv run --with awscli aws --endpoint-url "$S3_ENDPOINT_URL" s3 mb "s3://$DAGSTER_RUNTIME_BUCKET"

      - name: black
        run: uv run black --check src/ tests/ scripts/

      - name: dg check defs
        run: uv run dg check defs

      - name: pytest
        run: uv run pytest -q

      - name: pytest — S3 IO manager path
        env:
          WPRDC_IO_MANAGER: s3
          AWS_S3_ADDRESSING_STYLE: path
        run: uv run pytest -q

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }},${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # deploy/release deploys by the :<sha> tag; the digest is recorded here
      # so a release can be traced to the exact image.
      - run: |
          echo "WPRDC_ETL_IMAGE=${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
