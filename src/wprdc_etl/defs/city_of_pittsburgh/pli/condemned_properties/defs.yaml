type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Condemned Properties — https://data.wprdc.org/dataset/condemned-properties
# Ported from the legacy rocket-etl job old/payload/pgh/condemned_v2.py
# (schema CondemnedSchema; legacy cron `46 3 * * *`). Same public file the
# legacy job read; its property names checked against the live file on
# 2026-11-04. `header_case: lower` repeats the legacy engine's header folding
# (the file says `create_date_EST`).
#
# OWNER REDACTION: the file names every owner, and a condemned house that is
# someone's home would publish them. `redact_homestead_owners` blanks the
# owner wherever the parcel is homestead-exempt in property assessments (or
# isn't in it at all, or has no parcel id) — the legacy job's rule. It reads
# the assessments table on the CKAN this publishes to, and fails the run
# rather than publish if that read fails. Checked 2026-11-04: on the live
# file it blanks exactly the 584 of 3,594 owners the live table has blank.
#
# A GeoJSON of points published as a CSV table, as the legacy
# geojson-to-csv step did; the GeoJSON resource is re-derived from the same
# (redacted) frame.

attributes:
  publisher: city_of_pittsburgh
  department: pli
  dataset: condemned_properties
  source:
    type: http
    url: https://storage.googleapis.com/pghpa_open_data/agency_counter/condemned_dead_end_properties.geojson
    format: geojson
    header_case: lower
  schedule: "46 3 * * *"  # daily 03:46 ET
  partition: daily
  ingest: snapshot
  transforms:
    - op: point_coordinates
    - op: strip
    - op: regex_replace  # the legacy clean_address: "…, 15210-" -> "…, 15210"
      columns: [address]
      pattern: "-$"
    - op: rename
      mapping:
        parc_num: parcel_id
        zipcode: zip_code
        inspection_type: property_type
        create_date_est: create_date
        latest_inspec_result: latest_inspection_result
        latest_inspec_score: latest_inspection_score
        insp_status: inspection_status
    - op: coerce_text
      columns: [
        parcel_id, address, zip_code, owner, property_type,
        latest_inspection_result, record_number, inspection_status,
        neighborhood, council_district, ward,
      ]
    - op: redact_homestead_owners
      owner: owner
      parcel: parcel_id
      resource_id: "9a1c60bd-f9f7-4aba-aeb7-af8c3aaa44e5"  # Property Assessments
    - op: coerce_numeric
      columns: [latest_inspection_score]
      integer: true
    - op: coerce_numeric
      columns: [latitude, longitude]
    - op: to_datetime
      columns: [create_date]
      fmt: "%m-%d-%Y"
    - op: select
      columns: [
        parcel_id, address, zip_code, owner, property_type, create_date,
        latest_inspection_result, latest_inspection_score, record_number,
        inspection_status, latitude, longitude, neighborhood,
        council_district, ward,
      ]
  geocode: false
  ckan:
    package_id: "f9006efd-eac0-467a-a0d2-3b3a9a59cd39"  # condemned-properties
    resource_id: "0a963f26-eb4b-4325-bbbc-3ddf6a871410"  # Condemned Properties
  geometry:
    lat: latitude
    lng: longitude
  representations:
    - format: geojson
      resource_id: "e8f6f782-de70-4be0-a3fe-33153af8246d"  # Condemned Properties (GeoJSON)
