type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Tax Abatements — https://data.wprdc.org/dataset/city-property-tax-abatements
# Ported from the legacy rocket-etl job old/payload/pgh/treasury.py (schema
# TaxAbatementSchema; legacy cron `20 1 * * 4`, weekly). Same public file the legacy
# job read; its property names checked against the live file on 2026-11-02.
# `header_case: lower` repeats the legacy engine's header folding (the file
# says e.g. `approved_date_EST`, the legacy schema `approved_date_est`).
#
# A GeoJSON of points published as a CSV table, as the legacy
# geojson-to-csv step did: `point_coordinates` turns the geometry into the
# lat/lng columns the live table has and drops it.

attributes:
  publisher: city_of_pittsburgh
  department: finance
  dataset: tax_abatements
  source:
    type: http
    url: https://storage.googleapis.com/pghpa_open_data/finance/property_tax_abatement.geojson
    header_case: lower
  schedule: "18 5 * * 0"  # Sunday 05:18 ET
  partition: weekly
  ingest: snapshot
  transforms:
    - op: point_coordinates
      lat: lat
      lng: lng
    - op: strip
    - op: rename
      mapping:
        parc_num: pin
        approved_date_est: approved_date
        neighborhood_name: neighborhood
        lng: longitude
        lat: latitude
    - op: coerce_text
      columns: [
        pin, address, program_name, neighborhood, council_district, ward,
        dpw_streets, dpw_enviro, dpw_parks, police_zone, fire_zone,
      ]
    - op: coerce_numeric
      columns: [start_year, num_years, abatement_amount, longitude, latitude]
    - op: to_datetime
      columns: [approved_date]
    - op: select
      columns: [
        pin, address, start_year, approved_date, program_name, num_years,
        abatement_amount, neighborhood, council_district, ward, dpw_streets,
        dpw_enviro, dpw_parks, police_zone, fire_zone, longitude, latitude,
      ]
  geocode: false
  ckan:
    package_id: "1131f3a9-bbd8-4ca0-963a-c7ccadffcee4"  # city-property-tax-abatements
    resource_id: "fd924520-d568-4da2-967c-60b3a305e681"  # Tax Abatements
