type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Violations — https://data.wprdc.org/dataset/housing-and-community-environment-inspections
# Ported from the legacy rocket-etl job old/payload/ac_hd/hc_environment_inspections.py
# (schema ViolationsSchema; legacy cron `20 5 * * *`).
#
# UNVERIFIED against a real extract: the county SFTP isn't reachable from
# dev. Columns are the legacy job's `load_from` names, which the old engine
# matched after lower-casing every header — so `header_case: lower` does
# the same here, and schema.py lists them in that form. The renames map
# them onto the columns the live CKAN table already has, in its order.

attributes:
  publisher: allegheny_county
  department: health
  dataset: housing_violations
  source:
    type: sftp
    host: "{{ env('ALLEGHENY_SFTP_HOST', '') }}"
    port: "{{ env('ALLEGHENY_SFTP_PORT', '22') }}"
    path: "/WPRDC/Health Department/hce_violations.csv"
    secret_ref: ALLEGHENY_SFTP
    header_case: lower
  schedule: "20 5 * * *"  # daily 05:20 ET
  partition: daily
  ingest: snapshot
  transforms:
    - op: strip
    - op: rename
      mapping:
        completeddate: completed_date
        inspectionid: inspection_id
        violationid: violation_id
    - op: coerce_text
      columns: [
        inspection_id, service_request_number, violation_id, violation,
        description, status,
      ]
    - op: to_datetime
      columns: [completed_date]
    - op: select
      columns: [
        completed_date, inspection_id, service_request_number, violation_id,
        violation, description, status,
      ]
  geocode: false
  ckan:
    package_id: "19beed76-cd72-4fa8-9f8f-c402608ed569"  # housing-and-community-environment-inspections
    resource_id: "b5343af3-8c22-4833-96a0-0379aa7681e1"  # Violations
