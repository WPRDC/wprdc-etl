type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Inspections — https://data.wprdc.org/dataset/housing-and-community-environment-inspections
# Ported from the legacy rocket-etl job old/payload/ac_hd/hc_environment_inspections.py
# (schema InspectionsSchema; legacy cron `20 5 * * *`).
#
# UNVERIFIED against a real extract: the county SFTP isn't reachable from
# dev. Columns are the legacy job's `load_from` names, which the old engine
# matched after lower-casing every header — so `header_case: lower` does
# the same here, and schema.py lists them in that form. The renames map
# them onto the columns the live CKAN table already has, in its order.

attributes:
  publisher: allegheny_county
  department: health
  dataset: housing_inspections
  source:
    type: sftp
    host: "{{ env('ALLEGHENY_SFTP_HOST', '') }}"
    port: "{{ env('ALLEGHENY_SFTP_PORT', '22') }}"
    path: "/WPRDC/Health Department/hce_inspections.csv"
    secret_ref: ALLEGHENY_SFTP
    header_case: lower
  schedule: "20 5 * * *"  # daily 05:20 ET
  partition: daily
  ingest: snapshot
  transforms:
    - op: strip
    - op: rename
      mapping:
        inspectionid: inspection_id
        zip: zip_code
    - op: coerce_text
      columns: [
        service_request_number, inspection_type, street, city, state, zip_code,
        request_type, property_type, emergency_inspection_type,
      ]
    - op: coerce_numeric
      columns: [inspection_id]
    - op: to_datetime
      columns: [inspection_date]
    - op: select
      columns: [
        inspection_date, service_request_number, inspection_id, inspection_type,
        street, city, state, zip_code, request_type, property_type,
        emergency_inspection_type,
      ]
  geocode: false
  ckan:
    package_id: "19beed76-cd72-4fa8-9f8f-c402608ed569"  # housing-and-community-environment-inspections
    resource_id: "504190c4-d5ae-47bd-8cc7-086c49c962cc"  # Inspections
