type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Historical Vendors — https://data.wprdc.org/dataset/allegheny-county-farmers-markets-locations
# Ported from the legacy rocket-etl job old/payload/ac_hd/farmers_markets.py
# (schema VendorsSchema; legacy cron `13 4 1 * *`).
#
# UNVERIFIED against a real extract: the county SFTP isn't reachable from
# dev. Columns are the legacy job's `load_from` names, which the old engine
# matched after lower-casing every header — so `header_case: lower` does
# the same here, and schema.py lists them in that form. The renames map
# them onto the columns the live CKAN table already has, in its order.
#
# The county names this file by year; `{now:%Y}` resolves to the year the
# run starts (Eastern), as the legacy job's `current_year` did.
#
# ACCUMULATES: the legacy job upserted on the key below. Here every run
# merges the file into the stored table (_state/.../current.parquet) and
# publishes the whole table as one CSV through DataPusher+. Seed it from
# the live resource BEFORE the first publishing run, or that run reloads
# CKAN down to one file (in production, deploy/seed-accumulator):
#   bin/seed-accumulator --only allegheny_county/health/farmers_market_vendors_historical --write

attributes:
  publisher: allegheny_county
  department: health
  dataset: farmers_market_vendors_historical
  source:
    type: sftp
    host: "{{ env('ALLEGHENY_SFTP_HOST', '') }}"
    port: "{{ env('ALLEGHENY_SFTP_PORT', '22') }}"
    path: "/WPRDC/Health Department/alco_market_vendors_{now:%Y}.csv"
    secret_ref: ALLEGHENY_SFTP
    header_case: lower
  schedule: "30 4 1 * *"  # day 1 of the month, 04:30 ET
  partition: monthly
  ingest: snapshot
  publish: replace
  accumulate: true
  transforms:
    - op: strip
    - op: rename
      mapping:
        farmmarketid: market_id
        vendorid: vendor_id
        vendorname: vendor_name
        vendorphone: vendor_phone
        vendorschedule: vendor_schedule
    - op: coerce_text
      columns: [market_id, vendor_id, vendor_name, vendor_phone, vendor_schedule]
    - op: coerce_numeric
      columns: [latitude, longitude]
    - op: drop_nulls
      columns: [vendor_id]
    - op: select
      columns: [
        market_id, vendor_id, vendor_name, vendor_phone, vendor_schedule, latitude,
        longitude,
      ]
  geocode: false
  ckan:
    package_id: "5706fa23-87f6-4757-be8a-bcfc0b677e01"  # allegheny-county-farmers-markets-locations
    resource_id: "e33a7bc4-a185-4372-9a87-49060c87f797"  # Historical Vendors
    primary_key: [vendor_id, year]
