type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# TRI Facilities — https://data.wprdc.org/dataset/toxic-release-inventory
# Ported from the legacy rocket-etl job old/payload/ac_hd/toxic_inventory.py
# (schema ToxicFacilitiesSchema; legacy cron `40 7 1,3,5,8 1,4,7,10 *`).
#
# UNVERIFIED against a real extract: the county SFTP isn't reachable from
# dev. Columns are the legacy job's `load_from` names, which the old engine
# matched after lower-casing every header — so `header_case: lower` does
# the same here, and schema.py lists them in that form. The renames map
# them onto the columns the live CKAN table already has, in its order.

attributes:
  publisher: allegheny_county
  department: health
  dataset: tri_facilities
  source:
    type: sftp
    host: "{{ env('ALLEGHENY_SFTP_HOST', '') }}"
    port: "{{ env('ALLEGHENY_SFTP_PORT', '22') }}"
    path: "/WPRDC/Health Department/tri_facilities.csv"
    secret_ref: ALLEGHENY_SFTP
    header_case: lower
  schedule: "33 6 1 * *"  # day 1 of the month, 06:33 ET
  partition: monthly
  ingest: snapshot
  transforms:
    - op: strip
    - op: rename
      mapping:
        id: ID
        facility_name: FACILITY_NAME
        street_address: STREET_ADDRESS
        city_name: CITY_NAME
        county_name: COUNTY_NAME
        state_county_fips_code: STATE_COUNTY_FIPS_CODE
        state_abbr: STATE_ABBR
        zip_code: ZIP_CODE
        region: REGION
        fac_closed_ind: FAC_CLOSED_IND
        mail_name: MAIL_NAME
        mail_street_address: MAIL_STREET_ADDRESS
        mail_city: MAIL_CITY
        mail_state_abbr: MAIL_STATE_ABBR
        mail_province: MAIL_PROVINCE
        mail_country: MAIL_COUNTRY
        mail_zip_code: MAIL_ZIP_CODE
        asgn_federal_ind: ASGN_FEDERAL_IND
        asgn_agency: ASGN_AGENCY
        frs_id: FRS_ID
        parent_co_db_num: PARENT_CO_DB_NUM
        parent_co_name: PARENT_CO_NAME
        fac_latitude: FAC_LATITUDE
        fac_longitude: FAC_LONGITUDE
        pref_latitude: PREF_LATITUDE
        pref_longitude: PREF_LONGITUDE
        pref_accuracy: PREF_ACCURACY
        pref_collect_meth: PREF_COLLECT_METH
        pref_desc_category: PREF_DESC_CATEGORY
        pref_horizontal_datum: PREF_HORIZONTAL_DATUM
        pref_source_scale: PREF_SOURCE_SCALE
        pref_qa_code: PREF_QA_CODE
        asgn_partial_ind: ASGN_PARTIAL_IND
        asgn_public_contact: ASGN_PUBLIC_CONTACT
        asgn_public_phone: ASGN_PUBLIC_PHONE
        asgn_public_phone_ext: ASGN_PUBLIC_PHONE_EXT
        asgn_public_contact_email: ASGN_PUBLIC_CONTACT_EMAIL
        bia_code: BIA_CODE
        standardized_parent_company: STANDARDIZED_PARENT_COMPANY
        epa_registry_id: EPA_REGISTRY_ID
    - op: coerce_text
      columns: [
        ID, FACILITY_NAME, STREET_ADDRESS, CITY_NAME, COUNTY_NAME,
        STATE_COUNTY_FIPS_CODE, STATE_ABBR, ZIP_CODE, REGION, FAC_CLOSED_IND,
        MAIL_NAME, MAIL_STREET_ADDRESS, MAIL_CITY, MAIL_STATE_ABBR, MAIL_PROVINCE,
        MAIL_COUNTRY, MAIL_ZIP_CODE, ASGN_FEDERAL_IND, ASGN_AGENCY, FRS_ID,
        PARENT_CO_DB_NUM, PARENT_CO_NAME, FAC_LATITUDE, FAC_LONGITUDE,
        PREF_COLLECT_METH, PREF_DESC_CATEGORY, PREF_HORIZONTAL_DATUM,
        PREF_SOURCE_SCALE, PREF_QA_CODE, ASGN_PARTIAL_IND, ASGN_PUBLIC_CONTACT,
        ASGN_PUBLIC_PHONE, ASGN_PUBLIC_PHONE_EXT, ASGN_PUBLIC_CONTACT_EMAIL,
        BIA_CODE, STANDARDIZED_PARENT_COMPANY, EPA_REGISTRY_ID,
      ]
    - op: coerce_numeric
      columns: [PREF_LATITUDE, PREF_LONGITUDE, PREF_ACCURACY]
    - op: select
      columns: [
        ID, FACILITY_NAME, STREET_ADDRESS, CITY_NAME, COUNTY_NAME,
        STATE_COUNTY_FIPS_CODE, STATE_ABBR, ZIP_CODE, REGION, FAC_CLOSED_IND,
        MAIL_NAME, MAIL_STREET_ADDRESS, MAIL_CITY, MAIL_STATE_ABBR, MAIL_PROVINCE,
        MAIL_COUNTRY, MAIL_ZIP_CODE, ASGN_FEDERAL_IND, ASGN_AGENCY, FRS_ID,
        PARENT_CO_DB_NUM, PARENT_CO_NAME, FAC_LATITUDE, FAC_LONGITUDE,
        PREF_LATITUDE, PREF_LONGITUDE, PREF_ACCURACY, PREF_COLLECT_METH,
        PREF_DESC_CATEGORY, PREF_HORIZONTAL_DATUM, PREF_SOURCE_SCALE, PREF_QA_CODE,
        ASGN_PARTIAL_IND, ASGN_PUBLIC_CONTACT, ASGN_PUBLIC_PHONE,
        ASGN_PUBLIC_PHONE_EXT, ASGN_PUBLIC_CONTACT_EMAIL, BIA_CODE,
        STANDARDIZED_PARENT_COMPANY, EPA_REGISTRY_ID,
      ]
  geocode: false
  ckan:
    package_id: "2cff4c07-423a-4b61-af08-7288fbb773eb"  # toxic-release-inventory
    resource_id: "d41759fa-3099-46ae-8a0d-3198ccc80002"  # TRI Facilities
