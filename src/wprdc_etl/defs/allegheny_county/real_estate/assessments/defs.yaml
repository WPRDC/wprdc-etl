type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# The SFTP server is PUBLISHER-level: every allegheny_county SFTP dataset reads
# the same ALLEGHENY_SFTP_* vars, and the real hostname is deployment config, so
# it is deliberately NOT in this repo. An unconfigured environment resolves the
# host to "" and the extractor fails loudly on the first run.
#
# To pull through an `ssh -L` tunnel (real server behind a jump host):
#
#   ssh -N -L 2223:<the-real-host>:22 you@jump-host
#   ALLEGHENY_SFTP_HOST=localhost ALLEGHENY_SFTP_PORT=2223 uv run dg dev
#
# Templating only renders inside these blocks because every model in
# components/models.py is Resolvable — see the note there before changing one.

attributes:
  publisher: allegheny_county
  department: real_estate               # Allegheny County Dept. of Real Estate
  dataset: assessments
  source:
    type: sftp
    host: "{{ env('ALLEGHENY_SFTP_HOST', '') }}"
    port: "{{ env('ALLEGHENY_SFTP_PORT', '22') }}"
    path: /WPRDC/Property_Assessments/ALLEGHENY_COUNTY_MASTER_FILE.csv
    secret_ref: ALLEGHENY_SFTP
  schedule: "0 7 1 * *"  # day 1 of the month, 07:00 ET
  partition: monthly
  ingest: snapshot                       # full-state file -> DataPusher+ replace
  transforms:                            # shared primitives, run in order
    # Date formats DIFFER per the data dictionary — verify against a sample.
    - op: iso_date
      columns: [SALEDATE, RECORDDATE]
      fmt: "%d/%m/%Y"                    # documented dd/mm/yyyy
    - op: iso_date
      columns: [PREVSALEDATE, PREVSALEDATE2]
      fmt: "%m/%d/%Y"                    # documented mm/dd/yyyy
    - op: coerce_numeric
      columns: [SALEPRICE, PREVSALEPRICE, PREVSALEPRICE2,
                FAIRMARKETLAND, FAIRMARKETBUILDING, FAIRMARKETTOTAL,
                COUNTYTOTAL, LOCALTOTAL, LOTAREA]
    - op: strip
    - op: drop_nulls
      columns: [PARID]                   # a parcel row with no parcel id is junk
  # full_address derivation (bespoke) lives in the co-located transform.py.
  # Column contract (all columns, each required) lives in schema.py.
  geocode: false                         # parcels resolve via geometry join, not address geocoding
  ckan:
    # With WPRDC_ETL_SINK_DIR set, the loader writes locally and never calls
    # CKAN, so this can stay a placeholder for dev.
    resource_id: "REPLACE-WITH-CKAN-RESOURCE-UUID"