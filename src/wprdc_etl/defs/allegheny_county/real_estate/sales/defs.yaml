type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Property Sales Transactions — https://data.wprdc.org/dataset/real-estate-sales
# Ported from the legacy rocket-etl job old/payload/ac/sales_v2.py
# (schema SalesSchema; legacy cron `30 6 * * *`).
#
# UNVERIFIED against a real extract: the county SFTP isn't reachable from
# dev. Columns are the legacy job's `load_from` names, which the old engine
# matched after lower-casing every header — so `header_case: lower` does
# the same here, and schema.py lists them in that form. The renames map
# them onto the columns the live CKAN table already has, in its order.
#
# The file repeats a small share of its rows; the legacy job upserted on the
# key `drop_duplicates` uses, which collapsed them. `ckan.split_by_year`
# publishes the "<year> Property Sales Transactions" resources by SALEDATE
# year, as the legacy job's per-year filters did — every year, every run,
# because the county corrects back years (corrective deeds). A new year's
# resource is created on the first run with a sale in it.

attributes:
  publisher: allegheny_county
  department: real_estate
  dataset: sales
  source:
    type: sftp
    host: "{{ env('ALLEGHENY_SFTP_HOST', '') }}"
    port: "{{ env('ALLEGHENY_SFTP_PORT', '22') }}"
    path: "/WPRDC/Property_Assessments/AA301PAALL.csv"
    secret_ref: ALLEGHENY_SFTP
    header_case: lower
  schedule: "30 6 * * *"  # daily 06:30 ET
  partition: daily
  ingest: snapshot
  heavy: true
  transforms:
    - op: strip
    - op: rename
      mapping:
        parid: PARID
        full_address: FULL_ADDRESS
        propertyhousenum: PROPERTYHOUSENUM
        propertyfraction: PROPERTYFRACTION
        propertyaddressdir: PROPERTYADDRESSDIR
        propertyaddressstreet: PROPERTYADDRESSSTREET
        propertyaddresssuf: PROPERTYADDRESSSUF
        propertyaddressunitdesc: PROPERTYADDRESSUNITDESC
        propertyunitno: PROPERTYUNITNO
        propertycity: PROPERTYCITY
        propertystate: PROPERTYSTATE
        propertyzip: PROPERTYZIP
        schoolcode: SCHOOLCODE
        schooldesc: SCHOOLDESC
        municode: MUNICODE
        munidesc: MUNIDESC
        recorddate: RECORDDATE
        saledate: SALEDATE
        price: PRICE
        deedbook: DEEDBOOK
        deedpage: DEEDPAGE
        salecode: SALECODE
        saledesc: SALEDESC
        instrtyp: INSTRTYP
        instrtypdesc: INSTRTYPDESC
    - op: coerce_text
      columns: [
        PARID, FULL_ADDRESS, PROPERTYFRACTION, PROPERTYADDRESSDIR,
        PROPERTYADDRESSSTREET, PROPERTYADDRESSSUF, PROPERTYADDRESSUNITDESC,
        PROPERTYUNITNO, PROPERTYCITY, PROPERTYSTATE, SCHOOLCODE, SCHOOLDESC,
        MUNIDESC, DEEDBOOK, DEEDPAGE, SALECODE, SALEDESC, INSTRTYP, INSTRTYPDESC,
      ]
    - op: coerce_numeric
      columns: [PROPERTYHOUSENUM, PROPERTYZIP, MUNICODE, PRICE]
    - op: to_datetime
      columns: [RECORDDATE, SALEDATE]
    - op: drop_duplicates
      columns: [PARID, RECORDDATE, SALEDATE, DEEDBOOK, DEEDPAGE, INSTRTYP, PRICE, SALECODE]
    - op: select
      columns: [
        PARID, FULL_ADDRESS, PROPERTYHOUSENUM, PROPERTYFRACTION,
        PROPERTYADDRESSDIR, PROPERTYADDRESSSTREET, PROPERTYADDRESSSUF,
        PROPERTYADDRESSUNITDESC, PROPERTYUNITNO, PROPERTYCITY, PROPERTYSTATE,
        PROPERTYZIP, SCHOOLCODE, SCHOOLDESC, MUNICODE, MUNIDESC, RECORDDATE,
        SALEDATE, PRICE, DEEDBOOK, DEEDPAGE, SALECODE, SALEDESC, INSTRTYP,
        INSTRTYPDESC,
      ]
  geocode: false
  ckan:
    package_id: "9e0ce87d-07b8-420c-a8aa-9de6104f61d6"  # real-estate-sales
    resource_id: "5bbe6c55-bce6-4edb-9d04-68edeb6bf7b1"  # Property Sales Transactions
    split_by_year:
      column: SALEDATE
      since: 2012
      resource_name: "{year} Property Sales Transactions"
