type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Cumulative Delinquent Real Estate Taxes — https://data.wprdc.org/dataset/delinquent-real-estate-taxes
# Ported from the legacy rocket-etl job old/payload/ac/delinquent.py
# (schema DelinquentSchema; legacy cron `00 13 * * 6`).
#
# UNVERIFIED against a real extract: the county SFTP isn't reachable from
# dev. Columns are the legacy job's `load_from` names, which the old engine
# matched after lower-casing every header — so `header_case: lower` does
# the same here, and schema.py lists them in that form. The renames map
# them onto the columns the live CKAN table already has, in its order.
#
# The county posts one file per tax year (delinquent_2009.csv ...); the
# legacy job concatenated all of them into the cumulative table, deduplicated
# on ar_id, and pushed each file to its own "<year> ..." resource. Here
# `source.combine` lands every year's file as one CSV, `drop_duplicates`
# does the ar_id dedupe, and `ckan.split_by_year` publishes the per-year
# resources from the `year` column — a new year's resource is created on the
# first run that has rows for it. Verified on data.wprdc.org (2026-11-04):
# each per-year table holds only its own `year`, and the 17 of them sum to
# the cumulative table's 542,252 rows exactly.

attributes:
  publisher: allegheny_county
  department: real_estate
  dataset: delinquent_taxes_cumulative
  source:
    type: sftp
    host: "{{ env('ALLEGHENY_SFTP_HOST', '') }}"
    port: "{{ env('ALLEGHENY_SFTP_PORT', '22') }}"
    path: "/WPRDC/Dog_Licenses/delinquent_[0-9][0-9][0-9][0-9].csv"
    secret_ref: ALLEGHENY_SFTP
    header_case: lower
    combine: true
  schedule: "18 6 * * 0"  # Sunday 06:18 ET
  partition: weekly
  ingest: snapshot
  transforms:
    - op: strip
    - op: rename
      mapping:
        year_id: year
        tax_map: parcel_id_formatted
        tax_map_ufmt: parcel_id
        school_dist: school_district
        total_pymnts: total_payments
    - op: coerce_text
      columns: [ar_id, year, parcel_id_formatted, parcel_id, muni_name, school_district]
    - op: coerce_numeric
      columns: [penalties, interest, orig_bill, total_payments]
    - op: to_datetime
      columns: [last_pay_date, asof_date]
    - op: drop_nulls
      columns: [ar_id]
    - op: drop_duplicates
      columns: [ar_id]
    - op: select
      columns: [
        ar_id, year, parcel_id_formatted, parcel_id, muni_name, school_district,
        last_pay_date, penalties, interest, orig_bill, total_payments, asof_date,
      ]
  geocode: false
  ckan:
    package_id: "faf19fe1-4f68-4b2c-a166-31e6613531f4"  # delinquent-real-estate-taxes
    resource_id: "96e9d6b2-3e1a-4a0c-8ef6-23a049c263d8"  # Cumulative Delinquent Real Estate Taxes
    split_by_year:
      column: year
      since: 2009
      resource_name: "{year} Delinquent Real Estate Taxes"
