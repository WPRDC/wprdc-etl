type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Fatal Accidental Overdoses — https://data.wprdc.org/dataset/allegheny-county-fatal-accidental-overdoses
# Ported from the legacy rocket-etl job old/payload/ac/overdoses.py
# (schema FatalODSchema; legacy cron `10 6 * * *`).
#
# UNVERIFIED against a real extract: the county SFTP isn't reachable from
# dev. Columns are the legacy job's `load_from` names, which the old engine
# matched after lower-casing every header — so `header_case: lower` does
# the same here, and schema.py lists them in that form. The renames map
# them onto the columns the live CKAN table already has, in its order.

attributes:
  publisher: allegheny_county
  department: medical_examiner
  dataset: fatal_accidental_overdoses
  source:
    type: sftp
    host: "{{ env('ALLEGHENY_SFTP_HOST', '') }}"
    port: "{{ env('ALLEGHENY_SFTP_PORT', '22') }}"
    path: "/WPRDC/accidental_fatal_overdoses/acome_od_all.csv"
    secret_ref: ALLEGHENY_SFTP
    header_case: lower
  schedule: "10 6 * * *"  # daily 06:10 ET
  partition: daily
  ingest: snapshot
  transforms:
    - op: strip
    - op: rename
      mapping:
        "death.date.time": death_date_and_time
        "manner.of.death": manner_of_death
        "case.dispo": case_dispo
        "combined.od1": combined_od1
        "combined.od2": combined_od2
        "combined.od3": combined_od3
        "combined.od4": combined_od4
        "combined.od5": combined_od5
        "combined.od6": combined_od6
        "combined.od7": combined_od7
        "combined.od8": combined_od8
        "combined.od9": combined_od9
        "combined.od10": combined_od10
        "incident.zip": incident_zip
        "case.year": case_year
    - op: coerce_text
      columns: [
        manner_of_death, sex, race, case_dispo, combined_od1, combined_od2,
        combined_od3, combined_od4, combined_od5, combined_od6, combined_od7,
        combined_od8, combined_od9, combined_od10, incident_zip, decedent_zip,
      ]
    - op: coerce_numeric
      columns: [age, case_year]
    - op: to_datetime
      columns: [death_date_and_time]
    - op: select
      columns: [
        death_date_and_time, manner_of_death, age, sex, race, case_dispo,
        combined_od1, combined_od2, combined_od3, combined_od4, combined_od5,
        combined_od6, combined_od7, combined_od8, combined_od9, combined_od10,
        incident_zip, decedent_zip, case_year,
      ]
  geocode: false
  ckan:
    package_id: "7fb0505e-8e2c-4825-b22c-4fbee8fc8010"  # allegheny-county-fatal-accidental-overdoses
    resource_id: "1c59b26a-1684-4bfb-92f7-205b947530cf"  # Fatal Accidental Overdoses
