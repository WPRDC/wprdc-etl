type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Allegheny County Cemeteries
#
# GENERATED by scripts/sync_arcgis.py from the publisher's ArcGIS Hub
# catalogue. Safe to edit by hand — a re-sync leaves an existing file alone
# unless you pass --overwrite-defs.
#
# The source is addressed by catalogue TITLE, not URL: a Hub download URL
# embeds the ArcGIS item id and changes whenever the layer is republished,
# while the title is stable. `bin/arcgis --list` reports a title that has
# drifted out of the catalogue.
#
# GeoJSON is the source, so the validated frame is a GeoDataFrame carrying
# real geometry — the CSV export of a polygon layer has none, only
# Shape__Area / Shape__Length. Every CKAN resource below is a byte-for-byte
# copy of the publisher's own distribution, nothing is derived from the
# frame, and so there is no `ckan.resource_id`.
#
# Catalogue last reported this layer modified 2026-04-08.

attributes:
  publisher: allegheny_county
  department: gis
  dataset: cemeteries
  source:
    type: arcgis
    catalog: https://openac-alcogis.opendata.arcgis.com/data.json
    title: "Allegheny County Cemeteries"
    format: geojson
  schedule: "21 3 * * 0"  # Sunday 03:21 ET
  partition: weekly
  ingest: snapshot
  ckan:
    package_id: "7973ae28-2f11-46c0-9cbb-59af8b9271b7"
    # Push the publisher's description (HTML -> Markdown) and keywords onto
    # the package. Anything of ours goes in `description_suffix`, which is
    # appended and so survives an upstream edit.
    sync_metadata: true
    # Replaces the publisher's description. Sourced from this
    # dataset's curated text on data.wprdc.org.
    description: |-
      This dataset was previously obtained and regularly updated from [this URL](https://data.wprdc.org/dataset/allegheny-county-cemetery-outlines/resource/84e59451-7d70-438a-a50f-fd5f9f301aea/edit) on the [Allegheny County's GIS server](http://openac.alcogis.opendata.arcgis.com). We've switched to mirroring a new cemeteries dataset on the same server.

      **Description of previous version of this dataset:** "Outlines of public and private cemeteries greater than one acre in size.
      Areas were delineated following a generalized line along the outside edge of
      the area. Individual features within the cemetery are not shown."

      Category: Civic Vitality and Governance

      Department: Geographic Information Systems Group; Department of
      Administrative Services

      Coordinate System: Pennsylvania State Plane South Zone 3702; U.S. Survey Foot
    mirror:
      - format: geojson
        resource_id: "c8ae16de-8a25-4796-9775-67baa8294987"
        datastore: false   # needs the spatial load endpoint (not built yet)
      - format: csv
        resource_id: "2db54f3b-ae7c-4d54-af41-f0cb3e29bb8b"
        datastore: false   # flip to true if a queryable table is ever wanted
      - format: shapefile
        resource_id: "9dfe9edc-d148-49be-91fc-d5a7759c6ecc"
      - format: kml
        resource_id: "cf2b83d0-d9b7-438f-8c6f-187307a3df30"
      - format: hub_page
        resource_id: "84e59451-7d70-438a-a50f-fd5f9f301aea"
      - format: rest_api
        resource_id: "ca63df6f-89db-46cb-bf7a-862934665676"
