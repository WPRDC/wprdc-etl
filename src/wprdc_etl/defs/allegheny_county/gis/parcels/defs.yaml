type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Allegheny County Parcel Boundaries
#
# GENERATED by scripts/sync_pasda.py. Sourced from Penn State's PASDA
# archive, NOT the county's ArcGIS Hub: the county's data.json lists this
# layer with an "ArcGIS GeoServices REST API" distribution whose URL is in
# fact a PASDA landing page, and offers no downloadable file at all. The Hub
# generator therefore excludes it (CATALOGUE_EXCLUSIONS in sync_arcgis.py).
#
# Addressed by PASDA dataset id, not URL: the download filename carries a
# release date (AlleghenyCounty_Parcels20260928.zip), so a stored URL rots on every
# republish. The extractor resolves the current link off the landing page.
#
# `heavy: true` because this is a large file — the zipped shapefile alone is
# tens to hundreds of MB, several times that decoded — and the prod run
# coordinator serialises heavy decodes.

attributes:
  publisher: allegheny_county
  department: gis
  dataset: parcels
  source:
    type: pasda
    dataset_id: "1214"
    format: shapefile
  schedule: "0 5 1 * *"  # day 1 of the month, 05:00 ET
  partition: monthly
  ingest: snapshot
  heavy: true
  ckan:
    package_id: "709e4e52-6f82-4cd0-a848-f3e2b3f5d22b"
    # The DataStore table, published from the validated frame as CSV.
    resource_id: "858bbc0f-b949-4e22-b4bb-1a78fef24afc"
    sync_metadata: true
    # The curated text already on data.wprdc.org.
    description: |-
      This dataset contains boundaries of individual parcels in Allegheny County, including the county block and lot number. As this is a very large dataset, you may wish to use our property information extractor (http://tools.wprdc.org/parcels-n-at/) to download filtered versions of this parcel dataset.

      The most authoritative source for this data is now the PASDA page (https://www.pasda.psu.edu/uci/DataSummary.aspx?dataset=1214), which includes links to historical versions of the shapefile representations of this data.
  # The GeoJSON resource is DERIVED from the validated frame, not
  # copied: PASDA ships only a shapefile, so there is no upstream
  # GeoJSON to mirror.
  representations:
    - format: geojson
      resource_id: "3f50d47a-ab54-4da2-9f03-8519006e9fc9"
