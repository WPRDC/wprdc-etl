type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Allegheny County Zip Code Boundaries
#
# GENERATED by scripts/sync_arcgis.py from the publisher's ArcGIS Hub
# catalogue. Safe to edit by hand — a re-sync leaves an existing file alone
# unless you pass --overwrite-defs.
#
# The source is addressed by catalogue TITLE, not URL: a Hub download URL
# embeds the ArcGIS item id and changes whenever the layer is republished,
# while the title is stable. `bin/arcgis --list` reports a title that has
# drifted out of the catalogue.
#
# GeoJSON is the source, so the validated frame is a GeoDataFrame carrying
# real geometry — the CSV export of a polygon layer has none, only
# Shape__Area / Shape__Length. Every CKAN resource below is a byte-for-byte
# copy of the publisher's own distribution, nothing is derived from the
# frame, and so there is no `ckan.resource_id`.
#
# Catalogue last reported this layer modified 2026-01-08.

attributes:
  publisher: allegheny_county
  department: gis
  dataset: zip_codes
  source:
    type: arcgis
    catalog: https://openac-alcogis.opendata.arcgis.com/data.json
    title: "Allegheny County Zip Code Boundaries"
    format: geojson
  schedule: "0 7 * * 1"
  partition: weekly
  ingest: snapshot
  ckan:
    package_id: "1a5135de-cabe-4e23-b5e4-b2b8dd733817"
    # Push the publisher's description (HTML -> Markdown) and keywords onto
    # the package. Anything of ours goes in `description_suffix`, which is
    # appended and so survives an upstream edit.
    sync_metadata: true
    # Replaces the publisher's description. Sourced from this
    # dataset's curated text on data.wprdc.org.
    description: |-
      <div>This dataset demarcates the zip code boundaries that lie within Allegheny County.</div><div><br /></div><div>If viewing this description on the Western Pennsylvania Regional Data Center’s open data portal <a href='http://www.wprdc.org' target='_blank'>(http://www.wprdc.org)</a>, this dataset is harvested on a weekly basis from Allegheny County’s GIS data portal (<a href='http://openac.alcogis.opendata.arcgis.com/' target='_blank'>http://openac.alcogis.opendata.arcgis.com/</a>). The full metadata record for this dataset can also be found on Allegheny County’s GIS portal. You can access the metadata record and other resources on the GIS portal by clicking on the “Explore” button (and choosing the “Go to resource” option) to the right of the “ArcGIS Open Dataset” text below.</div><div><br /></div><div><b>Category</b>:  Civic Vitality and Governance</div><div><b><br /></b></div><div><b>Organization</b>:  Allegheny County</div><div><br /></div><div><b>Department:</b>  Geographic Information Systems Group; Department of Administrative Services</div><div><br /></div><div><b>Temporal Coverage:</b>  current</div><div><br /></div><div><b>Data Notes: </b></div><div><br /></div><div><b>Coordinate System:</b>  Pennsylvania State Plane South Zone 3702; U.S. Survey Foot</div><div><br /></div><div><b>Development Notes:</b>  none</div><div><br /></div><div><b>Other:</b> none</div><div><br /></div><div><b>Related Document(s):</b>  Data Dictionary (none)</div><div><br /></div><div><b>Frequency - Data Change:</b>  As needed</div><div><br /></div><div><b>Frequency - Publishing:</b>  As needed</div><div><b><br /></b></div><div><b>Data Steward Name:</b>  Eli Thomas</div><div><br /></div><div><b>Data Steward Email:</b> gishelp@alleghenycounty.us</div>
    mirror:
      - format: geojson
        resource_id: "14e5de97-0a5f-4521-84f6-ba74413db598"
        datastore: false   # needs the spatial load endpoint (not built yet)
      - format: csv
        resource_id: "0c781f02-2bb9-4d0c-9c45-879bde957f34"
        datastore: false   # flip to true if a queryable table is ever wanted
      - format: shapefile
        resource_id: "ec228c0e-6b1e-4f44-a335-df05546d52ea"
      - format: kml
        resource_id: "918be988-a349-48ae-add3-85c7ea5fb744"
      - format: hub_page
        resource_id: "20eba821-fd1f-47ed-8e36-57130811aa18"
      - format: rest_api
        resource_id: "b8393cb5-852f-4496-87e5-231384ee94b4"
  # Also feeds the PostGIS admin-region store, which is what
  # reverse_geocode resolves points against. Needs the geojson source:
  # replace_layer requires a GeoDataFrame.
  region_layer:
    name: zip_code
    value_field: ZIP
    label_field: NAME
