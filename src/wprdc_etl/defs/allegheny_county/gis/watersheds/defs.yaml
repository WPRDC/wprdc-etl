type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Allegheny County Watershed Boundaries
#
# GENERATED by scripts/sync_arcgis.py from the publisher's ArcGIS Hub
# catalogue. Safe to edit by hand — a re-sync leaves an existing file alone
# unless you pass --overwrite-defs.
#
# The source is addressed by catalogue TITLE, not URL: a Hub download URL
# embeds the ArcGIS item id and changes whenever the layer is republished,
# while the title is stable. `bin/arcgis --list` reports a title that has
# drifted out of the catalogue.
#
# GeoJSON is the source, so the validated frame is a GeoDataFrame carrying
# real geometry — the CSV export of a polygon layer has none, only
# Shape__Area / Shape__Length. Every CKAN resource below is a byte-for-byte
# copy of the publisher's own distribution, nothing is derived from the
# frame, and so there is no `ckan.resource_id`.
#
# Catalogue last reported this layer modified 2021-07-13.

attributes:
  publisher: allegheny_county
  department: gis
  dataset: watersheds
  source:
    type: arcgis
    catalog: https://openac-alcogis.opendata.arcgis.com/data.json
    title: "Allegheny County Watershed Boundaries"
    format: geojson
  schedule: "0 7 * * 1"
  partition: weekly
  ingest: snapshot
  ckan:
    package_id: "2194aa30-f6af-487d-9f9f-033e31192d6c"
    # Push the publisher's description (HTML -> Markdown) and keywords onto
    # the package. Anything of ours goes in `description_suffix`, which is
    # appended and so survives an upstream edit.
    sync_metadata: true
    # Replaces the publisher's description. Sourced from this
    # dataset's curated text on data.wprdc.org.
    description: |-
      This dataset demarcates the 52 isolated sub-Watersheds of Allegheny County that drain to single point on the main stem rivers. Created by 3 Rivers 2nd Nature based upon Allegheny County watershed file showing all tributaries of all streams. All tributaries draining to a single point on the river were joined as a single major stream system watershed for field measurement and analysis purposes.
    mirror:
      - format: geojson
        resource_id: "4b16b8a5-d156-4f53-911d-493a82492244"
        datastore: false   # needs the spatial load endpoint (not built yet)
      - format: csv
        resource_id: "53320397-34bb-45fb-9edf-5f18232ead02"
        datastore: false   # flip to true if a queryable table is ever wanted
      - format: shapefile
        resource_id: "f8b22c6a-90e5-4aed-9e99-68846c2f59e9"
      - format: kml
        resource_id: "0a1ffb0d-98c0-43b5-919e-2c0a817db150"
      - format: file_geodatabase
      - format: feature_collection
      - format: xlsx
      - format: geopackage
      - format: sqlite
      - format: hub_page
        resource_id: "dae2883b-5f28-41a1-8486-e909de389d8f"
      - format: rest_api
        resource_id: "fd96fbb3-3982-4ce5-9dce-6ef6272dba29"
