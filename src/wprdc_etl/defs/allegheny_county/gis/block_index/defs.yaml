type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Allegheny County Block Index
#
# GENERATED by scripts/sync_arcgis.py from the publisher's ArcGIS Hub
# catalogue. Safe to edit by hand — a re-sync leaves an existing file alone
# unless you pass --overwrite-defs.
#
# The source is addressed by catalogue TITLE, not URL: a Hub download URL
# embeds the ArcGIS item id and changes whenever the layer is republished,
# while the title is stable. `bin/arcgis --list` reports a title that has
# drifted out of the catalogue.
#
# GeoJSON is the source, so the validated frame is a GeoDataFrame carrying
# real geometry — the CSV export of a polygon layer has none, only
# Shape__Area / Shape__Length. Every CKAN resource below is a byte-for-byte
# copy of the publisher's own distribution, nothing is derived from the
# frame, and so there is no `ckan.resource_id`.
#
# Catalogue last reported this layer modified 2015-10-28.

attributes:
  publisher: allegheny_county
  department: gis
  dataset: block_index
  source:
    type: arcgis
    catalog: https://openac-alcogis.opendata.arcgis.com/data.json
    title: "Allegheny County Block Index"
    format: geojson
  schedule: "11 3 * * 0"  # Sunday 03:11 ET
  partition: weekly
  ingest: snapshot
  ckan:
    package_id: "31d1d279-7f81-466d-8aca-83a78719eaf8"
    # Push the publisher's description (HTML -> Markdown) and keywords onto
    # the package. Anything of ours goes in `description_suffix`, which is
    # appended and so survives an upstream edit.
    sync_metadata: true
    # Replaces the publisher's description. Sourced from this
    # dataset's curated text on data.wprdc.org.
    description: |-
      This dataset overlays a grid on the County to assist in locating a parcel. The grid squares are 3,500 by 4,500 square feet. The data was derived from original MAPINDX: Map Index Sheets from Block and Lot Grid of Property Assessment and based on aerial photography. Tiles are numbered in a clockwise spiral fashion starting with #1 at the point in downtown Pittsburgh. Each tile contains 16 Blocks. Each Index Sheet contains 16 lot/block sheets, labeled from left to right, top to bottom (4 across, 4 down): A, B, C, D, E, F, G, H, J, K, L, M, N, P, R, S. The first (4) numeric characters in a parcelID indicate the Index sheet in which the parcel can be found, the alpha character identifies the block in which most (or all) of the property lies.
    mirror:
      - format: geojson
        resource_id: "f4528690-966a-44d5-b83b-2687d5bb7bd5"
        datastore: false   # needs the spatial load endpoint (not built yet)
      - format: csv
        resource_id: "0637da66-2681-44f5-b343-281db3df7ffc"
        datastore: false   # flip to true if a queryable table is ever wanted
      - format: shapefile
        resource_id: "7290c028-8c2e-40ff-97a2-546ffaa1292e"
      - format: kml
        resource_id: "14db2dea-83fd-40ce-bbc1-44aac8fdf2bf"
      - format: file_geodatabase
      - format: feature_collection
      - format: xlsx
      - format: geopackage
      - format: sqlite
      - format: hub_page
        resource_id: "3cc266e9-735d-46b6-8191-c5cf7e44883c"
      - format: rest_api
        resource_id: "656b6cac-9023-4085-b6f7-1a4f3c08fd48"
