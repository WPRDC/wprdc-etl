type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Allegheny County Addressing Landmarks
#
# GENERATED by scripts/sync_arcgis.py from the publisher's ArcGIS Hub
# catalogue. Safe to edit by hand — a re-sync leaves an existing file alone
# unless you pass --overwrite-defs.
#
# The source is addressed by catalogue TITLE, not URL: a Hub download URL
# embeds the ArcGIS item id and changes whenever the layer is republished,
# while the title is stable. `bin/arcgis --list` reports a title that has
# drifted out of the catalogue.
#
# A plain TABLE, not a feature layer: its REST endpoint reports type
# "Table" and there is no geometry. Each row's ADDRESS_ID keys into the
# address_point key layer, so join_geometry adds latitude/longitude from
# it and the JOINED frame is published as the CSV DataStore resource. The
# publisher's own CSV is not copied (it has no coordinates), and the geometry
# formats the Hub offers are left out — exported from a table they are empty.
#
# Catalogue last reported this layer modified 2025-12-10.

attributes:
  publisher: allegheny_county
  department: gis
  dataset: addressing_landmarks
  source:
    type: arcgis
    catalog: https://openac-alcogis.opendata.arcgis.com/data.json
    title: "Allegheny County Addressing Landmarks"
    format: csv
  schedule: "0 3 * * 0"  # Sunday 03:00 ET
  partition: weekly
  ingest: snapshot
  ckan:
    # NOT YET CREATED. This id is minted from the catalogue title and
    # is stable, but no package carries it: run `bin/seed-ckan --write`
    # against the target portal before publishing.
    package_id: "5a07d365-18f7-51d9-889c-f11b3fad396e"
    # The DataStore table, published from the validated + joined frame.
    resource_id: "3b2cf234-d1fd-5d3d-84db-4f808dcd46c4"
    # Push the publisher's description (HTML -> Markdown) and keywords onto
    # the package. Anything of ours goes in `description_suffix`, which is
    # appended and so survives an upstream edit.
    sync_metadata: true
    # STUB from the publisher's catalogue description (harvest
    # boilerplate removed). REVIEW before publishing: it replaces
    # the package notes on every run.
    description: |-
      This table contains the Addressing Landmarks in Allegheny County.  The Landmarks are points of interest and names of facilities, locations, parks, and other named places.  These are maintained by Allegheny County, but may not include every named location.
    mirror:
      - format: hub_page
      - format: rest_api
  # Coordinates from the address_point key layer (loaded by its `key_layer:`
  # pipeline). Unmatched keys publish with blank coordinates and are
  # counted in the run log.
  transforms:
    # The key column reads as float when it has a blank (450843.0);
    # publish it as the id it is.
    - op: coerce_text
      columns: [ADDRESS_ID]
    - op: join_geometry
      layer: address_point
      key: ADDRESS_ID
      key_format: "SSAP{}"
