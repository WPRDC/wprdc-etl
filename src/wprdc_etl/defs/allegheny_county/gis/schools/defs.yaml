    # Replaces the publisher's description. Sourced from this
    # dataset's curated text on data.wprdc.org.
    description: |-
      ## Overview

      These geocoded locations for Allegheny County schools (public, private, charter, and career and technical centers) are based on the Allegheny County extract of Public and Private school names, addresses and enrollment data via [Education Demographics and Geographic Estimates from the National Center for Education Statistics](https://nces.ed.gov/programs/edge/geographic/schoollocations) and [Enrollment Reports as of October 1 submitted to the Pennsylvania Department of Education](https://www.pa.gov/agencies/education/data-and-reporting/enrollment#accordion-cb5f3bee47-item-9b3fcf9ab9). The address data for public schools are based on data reported in the NCES Common Core of Data, which is an annual collection of enrollment, staffing and program participation for schools as reported to the Unites States Department of Education. 
     
      ---

      ## Further Documentation and Resources

      This data and documentation was pulled from [a dataset](https://openac-alcogis.opendata.arcgis.com/datasets/AlCoGIS::allegheny-county-schools-1/about) on the [Allegheny County GIS server](https://openac-alcogis.opendata.arcgis.com/).

      An earlier version of this dataset (listing Allegheny County schools from 2018), may be found at [https://data.wprdc.org/dataset/allegheny-county-public-schools-local-education-agency-leas-locations](https://data.wprdc.org/dataset/allegheny-county-public-schools-local-education-agency-leas-locations).
