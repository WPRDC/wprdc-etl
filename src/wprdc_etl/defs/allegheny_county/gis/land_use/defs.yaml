type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Allegheny County Land Use Areas
#
# GENERATED by scripts/sync_arcgis.py from the publisher's ArcGIS Hub
# catalogue. Safe to edit by hand — a re-sync leaves an existing file alone
# unless you pass --overwrite-defs.
#
# The source is addressed by catalogue TITLE, not URL: a Hub download URL
# embeds the ArcGIS item id and changes whenever the layer is republished,
# while the title is stable. `bin/arcgis --list` reports a title that has
# drifted out of the catalogue.
#
# GeoJSON is the source, so the validated frame is a GeoDataFrame carrying
# real geometry — the CSV export of a polygon layer has none, only
# Shape__Area / Shape__Length. Every CKAN resource below is a byte-for-byte
# copy of the publisher's own distribution, nothing is derived from the
# frame, and so there is no `ckan.resource_id`.
#
# Catalogue last reported this layer modified 2015-10-28.

attributes:
  publisher: allegheny_county
  department: gis
  dataset: land_use
  source:
    type: arcgis
    catalog: https://openac-alcogis.opendata.arcgis.com/data.json
    title: "Allegheny County Land Use Areas"
    format: geojson
  schedule: "0 7 * * 1"
  partition: weekly
  ingest: snapshot
  ckan:
    package_id: "9cb09db9-bad9-4f60-a854-1ea479ef601d"
    # Push the publisher's description (HTML -> Markdown) and keywords onto
    # the package. Anything of ours goes in `description_suffix`, which is
    # appended and so survives an upstream edit.
    sync_metadata: true
    # Replaces the publisher's description. Sourced from this
    # dataset's curated text on data.wprdc.org.
    description: |-
      Allegheny County land use as ascribed to areas of land. The Land Use
      Feature Dataset contains photogrammetrically compiled information concerning
      vegetation and limited open areas of ground. The Land Use Feature Dataset
      contains Woodlands, Nurseries and Orchards, Cultivated Fields and Athletic
      Fields. Woodlands are groups of trees, whether coniferous or deciduous.
      Woodland areas that are one (1) acre or greater in size are digitized from the
      aerial photography. Nurseries and Orchards are areas that indicate cultivated
      trees. These areas are usually identified because the trees are found in evenly
      spaced rows. Nursery and Orchard areas that are one (1) acre or greater in size
      are digitized from the aerial photography. Cultivated Fields are those areas
      that are used for crops. Pasture land and land that, according to the aerial
      photographs and aerial interpretation, has been permitted to lie fallow for an
      extended period is not considered cultivated areas. Cultivated Field areas that
      are one (1) acre or greater in size are digitized from the aerial photography.
      Athletic Fields are sport fields that have a natural surface. The apparent
      outline of the land area used for athletic purposes is digitized from the
      aerial photography and not just the actual athletic field.
    mirror:
      - format: geojson
        resource_id: "e5f9adda-fd3c-434f-ae7b-429929451c90"
        datastore: false   # needs the spatial load endpoint (not built yet)
      - format: csv
        resource_id: "88a8c9a1-d854-42ac-b674-cc60619e26bf"
        datastore: false   # flip to true if a queryable table is ever wanted
      - format: shapefile
        resource_id: "3f49eb25-adc3-43f7-b5c7-45e35f3951e9"
      - format: kml
        resource_id: "490a96c8-a7fa-47de-adc3-1bcaef3b69e9"
      - format: file_geodatabase
      - format: feature_collection
      - format: xlsx
      - format: geopackage
      - format: sqlite
      - format: hub_page
        resource_id: "da2190b1-88d0-40c7-9af7-0dc73d8c775c"
      - format: rest_api
        resource_id: "38b5fe0e-2f25-4533-aff8-a0fe7bb68edb"
