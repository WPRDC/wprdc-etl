type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Allegheny County Municipal Boundaries
#
# GENERATED by scripts/sync_arcgis.py from the publisher's ArcGIS Hub
# catalogue. Safe to edit by hand — a re-sync leaves an existing file alone
# unless you pass --overwrite-defs.
#
# The source is addressed by catalogue TITLE, not URL: a Hub download URL
# embeds the ArcGIS item id and changes whenever the layer is republished,
# while the title is stable. `bin/arcgis --list` reports a title that has
# drifted out of the catalogue.
#
# GeoJSON is the source, so the validated frame is a GeoDataFrame carrying
# real geometry — the CSV export of a polygon layer has none, only
# Shape__Area / Shape__Length. Every CKAN resource below is a byte-for-byte
# copy of the publisher's own distribution, nothing is derived from the
# frame, and so there is no `ckan.resource_id`.
#
# Catalogue last reported this layer modified 2025-09-12.

attributes:
  publisher: allegheny_county
  department: gis
  dataset: municipal_boundaries
  source:
    type: arcgis
    catalog: https://openac-alcogis.opendata.arcgis.com/data.json
    title: "Allegheny County Municipal Boundaries"
    format: geojson
  schedule: "36 4 * * 0"  # Sunday 04:36 ET
  partition: weekly
  ingest: snapshot
  ckan:
    package_id: "2fa577d6-1a6b-46a8-8165-27fecac1dee5"
    # Push the publisher's description (HTML -> Markdown) and keywords onto
    # the package. Anything of ours goes in `description_suffix`, which is
    # appended and so survives an upstream edit.
    sync_metadata: true
    # Replaces the publisher's description. Sourced from this
    # dataset's curated text on data.wprdc.org.
    description: |-
      This dataset demarcates the municipal boundaries in Allegheny County. Data was created to portray the boundaries of the 130 Municipalities in Allegheny County the attribute table includes additional descriptive information including Councils of Government (COG) affiliation (regional governing and coordinating bodies comprised of several bordering municipalities), School District, Congressional District, FIPS and County Municipal Code and County Council
      District.

      This dataset is harvested on a weekly basis from [Allegheny County’s GIS data portal](http://openac.alcogis.opendata.arcgis.com/). The full metadata record for this dataset can also be found on Allegheny County's GIS portal. You can access the metadata record and other resources on the GIS portal by clicking on the "Explore" button (and choosing the "Go to resource" option) to the right of the "ArcGIS Open Dataset" text below.

      Category: Civic Vitality and Governance

      Department: Geographic Information Systems Group; Department of Administrative Services
    mirror:
      - format: geojson
        resource_id: "b0cb0249-d1ba-45b7-9918-dc86fa8af04c"
        datastore: false   # needs the spatial load endpoint (not built yet)
      - format: csv
        resource_id: "44ef6677-ade7-4fda-a32c-93cf124cf09b"
        datastore: false   # flip to true if a queryable table is ever wanted
      - format: shapefile
        resource_id: "744aa7aa-b75e-41d3-8b15-6c1288e43844"
      - format: kml
        resource_id: "7916c74c-8612-4edf-919b-8605a23af526"
      - format: file_geodatabase
      - format: feature_collection
      - format: xlsx
      - format: geopackage
      - format: sqlite
      - format: hub_page
        resource_id: "5d1d6419-b8c1-421d-a3b7-028b388f01f5"
      - format: rest_api
        resource_id: "f82f1dcf-3aac-4cf7-bdda-b937382378cc"
  # Also feeds the PostGIS admin-region store, which is what
  # reverse_geocode resolves points against. Needs the geojson source:
  # replace_layer requires a GeoDataFrame.
  region_layer:
    name: municipality
    value_field: MUNICODE
    label_field: LABEL
