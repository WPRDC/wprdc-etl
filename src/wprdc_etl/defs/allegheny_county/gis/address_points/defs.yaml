type: wprdc_etl.components.tabular_pipeline.TabularPipeline

# Allegheny County Addressing Address Points
#
# GENERATED by scripts/sync_pasda.py. Sourced from Penn State's PASDA
# archive, NOT the county's ArcGIS Hub: the county's data.json lists this
# layer with an "ArcGIS GeoServices REST API" distribution whose URL is in
# fact a PASDA landing page, and offers no downloadable file at all. The Hub
# generator therefore excludes it (CATALOGUE_EXCLUSIONS in sync_arcgis.py).
#
# Addressed by PASDA dataset id, not URL: the download filename carries a
# release date (AlleghenyCounty_AddressPoints20260928.zip), so a stored URL rots on every
# republish. The extractor resolves the current link off the landing page.
#
# `heavy: true` because this is a large file — the zipped shapefile alone is
# tens to hundreds of MB, several times that decoded — and the prod run
# coordinator serialises heavy decodes.

attributes:
  publisher: allegheny_county
  department: gis
  dataset: address_points
  source:
    type: pasda
    dataset_id: "1219"
    format: shapefile
  schedule: "0 3 1 * *"  # day 1 of the month, 03:00 ET
  partition: monthly
  ingest: snapshot
  heavy: true
  ckan:
    package_id: "4988ae5c-a677-4a7f-9bd0-e735c19a8ff3"
    # The DataStore table, published from the validated frame as CSV.
    resource_id: "ddc46dc5-65bf-42d2-b67d-dd45954b25da"
    sync_metadata: true
    # The curated text already on data.wprdc.org.
    description: |-
      This dataset shows the Address Points in Allegheny County. The Address Points were created by GDR for the Allegheny County CAD project, October 2008. Data is updated by County staff as changes and corrections are found, on a continuous basis. Updates are sent to PASDA monthly.

      The most authoritative source for this data is now the PASDA page (https://www.pasda.psu.edu/uci/DataSummary.aspx?dataset=1219), which includes links to historical versions of the shapefile representations of this data.
  # The GeoJSON resource is DERIVED from the validated frame, not
  # copied: PASDA ships only a shapefile, so there is no upstream
  # GeoJSON to mirror.
  representations:
    - format: geojson
      resource_id: "492a62fb-0560-43f0-9f8e-037fc51343a0"
  # Also feeds the PostGIS keyed-geometry store, where the
  # join_geometry transform looks a row's coordinates up by key.
  key_layer:
    name: address_point
    key_field: ADDRESS_ID
