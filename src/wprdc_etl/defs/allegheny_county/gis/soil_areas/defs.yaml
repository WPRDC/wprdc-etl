# Allegheny County Soil Type Areas
#
# GENERATED by scripts/sync_arcgis.py from the publisher's ArcGIS Hub
# catalogue. Safe to edit by hand — a re-sync leaves an existing file alone
# unless you pass --overwrite-defs.
#
# The source is addressed by catalogue TITLE, not URL: a Hub download URL
# embeds the ArcGIS item id and changes whenever the layer is republished,
# while the title is stable. `bin/arcgis --list` reports a title that has
# drifted out of the catalogue.
#
# GeoJSON is the source, so the validated frame is a GeoDataFrame carrying
# real geometry — the CSV export of a polygon layer has none, only
# Shape__Area / Shape__Length. Every CKAN resource below is a byte-for-byte
# copy of the publisher's own distribution, nothing is derived from the
# frame, and so there is no `ckan.resource_id`.
#
# Catalogue last reported this layer modified 2025-10-30.

attributes:
  publisher: allegheny_county
  department: gis
  dataset: soil_areas
  source:
    type: arcgis
    catalog: https://openac-alcogis.opendata.arcgis.com/data.json
    title: "Allegheny County Soil Type Areas"
    format: geojson
  schedule: "24 5 * * 0"  # Sunday 05:24 ET
  partition: weekly
  ingest: snapshot
  ckan:
    package_id: "749d1cdb-cd9e-4da2-bfdc-1fe299f9ba84"
    # Push the publisher's description (HTML -> Markdown) and keywords onto
    # the package. Anything of ours goes in `description_suffix`, which is
    # appended and so survives an upstream edit.
    sync_metadata: true
    # Replaces the publisher's description. Sourced from this
    # dataset's curated text on data.wprdc.org.
    description: |-
      This dataset contains soil type and soil classification, by area.

      This dataset is harvested on a weekly basis from [Allegheny County’s GIS data portal](http://openac.alcogis.opendata.arcgis.com). The full metadata record for this dataset can also be found on Allegheny County's GIS portal. You can access the metadata record and other resources on the GIS portal by clicking on the "Explore button (and choosing the "Go to resource" option) to the right of the "ArcGIS Open Dataset" text below.

      Category: Environment

      Department: Geographic Information Systems Group; Department of Administrative Services

      Development Notes: This data set is a digital soil survey and generally is the most detailed level of soil geographic data developed by the National Cooperative Soil Survey. The information was prepared by digitizing maps, by compiling information onto a planimetric correct base and digitizing, or by revising digitized maps using remotely sensed and other information. This data set consists of georeferenced digital map data and computerized attribute data. The map data are in a soil survey area extent format and include a
      detailed, field verified inventory of soils and miscellaneous areas that normally occur in a repeatable pattern on the landscape and that can be cartographically shown at the scale mapped. A special soil features layer (point and line features) is optional. This layer displays the location of features too small to delineate at the mapping scale, but they are large enough and contrasting enough to significantly influence use and management. The soil
      map units are linked to attributes in the National Soil Information System relational database, which gives the proportionate extent of the component soils and their properties. The soil map and data used in the SSURGO product were prepared by soil scientists as part of
      the National Cooperative Soil Survey.

      Related Documents: [Data Dictionary for SOIL_CODE](https://alleghenycounty-my.sharepoint.com/:t:/g/personal/melinda_angeles_alleghenycounty_us/ETPZnkA93thJs6tnW7ZivmMBL0KH6dFMQa5_Ax8m3OkMdQ?e=cYsXcz), https://www.nrcs.usda.gov/Internet/FSE_MANUSCRIPTS/pennsylvania/PA003/0/legends.pdf (the last page includes the soil legend for this dataset)
    mirror:
