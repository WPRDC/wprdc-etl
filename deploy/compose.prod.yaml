# Production stack for a single VM. Nothing host-specific is committed; the
# deploy step writes three files under /opt/wprdc-etl/ (see deploy/ROLLOUT.md):
#
#   deploy.env   compose interpolation: WPRDC_ETL_IMAGE, DAGSTER_DOMAIN,
#                ENVIRONMENT (empty = dry run, `production` = publish),
#                WPRDC_SCHEDULES_PAUSED (1 = schedules default to stopped)
#   prod.env     app secrets, 0600: DAGSTER_PG_URL, SPATIAL_DSN, CKAN_API_TOKEN,
#                per-source SFTP creds, DAGSTER_SLACK_BOT_TOKEN
#   proxy.env    Caddy basic-auth, 0600: DAGSTER_UI_USER, DAGSTER_UI_PASSWORD_HASH
#   known_hosts  verified SFTP host keys (OpenSSH format)
#
#   docker compose --env-file /opt/wprdc-etl/deploy.env \
#     -f deploy/compose.prod.yaml up -d
#
# The VM needs an IAM instance profile granting: s3 R/W on the landing +
# runtime buckets, and secretsmanager:GetSecretValue on the secret(s).

# Docker's json-file logs never rotate by default and would fill the disk;
# 5 x 50 MB per container is days of history (the run logs proper are in S3).
x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

x-app: &app
  image: ${WPRDC_ETL_IMAGE:?set WPRDC_ETL_IMAGE to the pushed image ref}
  restart: unless-stopped
  logging: *logging
  env_file:
    - /opt/wprdc-etl/prod.env          # secrets, deploy-time from Secrets Manager
  environment:
    # `?` not `:?`: empty is a valid value (dry run); only unset is an error,
    # so a deploy that forgot deploy.env can't silently pick a mode.
    ENVIRONMENT: ${ENVIRONMENT?set ENVIRONMENT in deploy.env (empty = dry run)}
    AWS_REGION: us-east-1
    LANDING_BUCKET: wprdc-etl-landing
    DAGSTER_RUNTIME_BUCKET: wprdc-dagster-runtime
    DAGSTER_MAX_CONCURRENT_RUNS: "4"
    CKAN_URL: https://data.wprdc.org
    DAGSTER_WEBSERVER_URL: https://${DAGSTER_DOMAIN:?set DAGSTER_DOMAIN in deploy.env}
    WPRDC_ALERT_SLACK_CHANNEL: "#wprdc-etl-alerts"
    DAGSTER_HOME: /opt/dagster/home
    SFTP_KNOWN_HOSTS: /opt/dagster/known_hosts
    WPRDC_SCHEDULES_PAUSED: ${WPRDC_SCHEDULES_PAUSED:-}
  volumes:
    - dagster-local:/opt/dagster/home/local   # compute-log staging + artifacts
    - /opt/wprdc-etl/known_hosts:/opt/dagster/known_hosts:ro

services:
  # Long-lived gRPC code server. DefaultRunLauncher launches each run as a
  # SUBPROCESS of this container — size its resources for
  # DAGSTER_MAX_CONCURRENT_RUNS concurrent pandas jobs + one `heavy` outlier.
  code-location:
    <<: *app
    command:
      - dagster
      - code-server
      - start
      - -m
      - wprdc_etl.definitions
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    deploy:
      resources:
        limits:
          memory: 6g
    healthcheck:
      test: ["CMD", "dagster-webserver", "--help"]  # process-alive smoke
      interval: 30s
      timeout: 10s
      retries: 5

  daemon:
    <<: *app
    command: ["dagster-daemon", "run"]
    depends_on: [code-location]
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 60s
      timeout: 10s
      retries: 3

  webserver:
    <<: *app
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /opt/dagster/home/workspace.yaml
    depends_on: [code-location]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3000/server_info').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Authenticating reverse proxy in front of the (auth-less) webserver.
  # Swap Caddy basic-auth for oauth2-proxy if you need SSO.
  proxy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on: [webserver]
    env_file:
      - /opt/wprdc-etl/proxy.env   # DAGSTER_UI_USER, DAGSTER_UI_PASSWORD_HASH
    environment:
      DAGSTER_DOMAIN: ${DAGSTER_DOMAIN:?set DAGSTER_DOMAIN in deploy.env}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  dagster-local:
  caddy-data:
  caddy-config:
