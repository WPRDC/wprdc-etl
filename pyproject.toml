[project]
name = "wprdc_etl"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
# Dagster core + libraries are pinned EXACTLY: a minor bump changes the
# run/event/schedule Postgres schema and requires `dagster instance migrate`
# (run on first prod boot and every version bump). Move them together, in a PR
# that also refreshes uv.lock and runs the migration.
dependencies = [
    "dagster==1.13.14",
    "dagster-postgres==0.29.14", # Postgres run/event/schedule storage (prod: managed PG)
    "dagster-aws==0.29.14", # S3 pickle IO manager + S3 compute log manager (prod)
    "dagster-slack==0.29.14", # run-failure alert sensor (prod)
    "dagster-webserver==1.13.14", # the UI process (prod runs it; `uv sync --no-dev` keeps it)
    "boto3>=1.34,<2", # S3 landing zone
    # geopandas/shapely/pyproj/pandas/pandera class refs get embedded in the
    # S3PickleIOManager pickles, so a mismatch breaks cross-run re-execution of
    # `loaded` / representation assets. Keep them on a known minor.
    "pandas~=2.3.3",
    "pandera~=0.32.1", # schema validation
    "geopandas~=1.1.4", # geospatial read + representations
    "shapely~=2.1.2",
    "pyproj~=3.7.1",
    "paramiko~=5.0.0", # SFTP
    "requests~=2.34.0", # CKAN Action API
    # PostGIS client for the admin-region store (SpatialResource). Not pickled by
    # the IO manager, so the pinning note above doesn't apply to it.
    "psycopg[binary]~=3.2",
    # Parquet engine for the accumulator's canonical table
    # (_state/.../current.parquet). Also not pickled by the IO manager, so the
    # pinning note above doesn't apply. Floor is 22: that's the first release
    # with cp314 wheels, and below it pip tries to build Arrow C++ from source.
    "pyarrow~=25.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli==1.13.14", # the `dg` CLI (dg dev / dg check)
    "questionary", # scripts/scaffold_pipeline.py
    "pytest",
    "black",
    "pre-commit", # git pre-commit hook runner (see .pre-commit-config.yaml)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wprdc_etl"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "wprdc_etl"
code_location_target_module = "wprdc_etl.definitions"
registry_modules = ["wprdc_etl.components.*"]


[tool.dagster]
module_name = "wprdc_etl.definitions"
code_location_name = "wprdc_etl"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88