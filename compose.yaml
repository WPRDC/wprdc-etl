# Local dev dependencies for wprdc-etl.
#
#   docker compose up -d
#
# Brings up an S3 (LocalStack), a PostGIS-enabled Postgres, and an SFTP server
# you can use as a test source.
#
# CKAN is NOT here — it's a heavy multi-service stack and you already have a
# dockerized deployment; point CKAN_URL at that (see dev/README.md). For most
# iteration you don't need CKAN at all: set WPRDC_ETL_SINK_DIR and the loaders
# write output to a local folder instead.
#
# TWO Postgres servers, with unrelated jobs:
#   postgres (5432)            -> Dagster's own run/event/schedule storage
#   postgis  ($POSTGIS_PORT)   -> the admin-region boundary store (SPATIAL_DSN)
#
# The PostGIS host port is an env var because 5433 is a common default for other
# local Postgres containers (a dockerized CKAN's database, for one). Set
# POSTGIS_PORT in .env and BOTH the port mapping below and SPATIAL_DSN follow it
# — .env expands ${POSTGIS_PORT} inside the DSN, so there's one value to change.
#
# They're separate in dev for a boring reason: the official postgres:17 image is
# Debian trixie (glibc 2.41) while postgis/postgis:17-3.5 is bullseye (glibc
# 2.31). Pointing the PostGIS image at the existing dagster volume trips a
# collation version mismatch, and "fixing" it means downgrading the collation of
# a data directory holding real run history. A second volume initialized by the
# PostGIS image sidesteps that entirely.
#
# PRODUCTION IS DIFFERENT: there, `spatial` is just another database on the
# managed Postgres instance with the postgis extension enabled — one server, no
# image involved. See deploy/README.md.

services:
  localstack:
    image: localstack/localstack:3
    container_name: wprdc-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

  postgres:
    image: postgres:17
    container_name: wprdc-dagster-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    ports:
      - "5432:5432"
    volumes:
      - dagster_pg:/var/lib/postgresql/data

  postgis:
    # The admin-region boundary store. Separate SERVICE, separate volume — see
    # the note at the top of the file for why it isn't the `dagster` server.
    #
    # The image's own init scripts create the postgis extension in POSTGRES_DB,
    # so there's nothing to run by hand on a fresh volume.
    image: postgis/postgis:17-3.5
    # postgis/postgis publishes linux/amd64 only. On an Apple Silicon dev box
    # this runs under emulation — fine for boundary layers (hundreds of rows),
    # and prod/CI are x86 where it's native.
    platform: linux/amd64
    container_name: wprdc-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: spatial
    ports:
      # Host port is configurable (see the note at the top); container side is
      # always 5432. SPATIAL_DSN must use the same host port.
      - "${POSTGIS_PORT:-5434}:5432"
    volumes:
      - spatial_pg:/var/lib/postgresql/data

  sftp:
    image: atmoz/sftp:alpine
    container_name: wprdc-sftp
    restart: unless-stopped
    # user:password:uid:gid:dir  -> creates /home/wprdc/outbound
    command: "wprdc:wprdc:1001:1001:outbound"
    ports:
      - "2222:22"     # connect to localhost:2222 (source.port: 2222)
    volumes:
      # Drop test files in dev/sftp/ and they appear under /outbound on the server.
      - ./dev/sftp:/home/wprdc/outbound

volumes:
  localstack_data:
  dagster_pg:
  spatial_pg:

# ---------------------------------------------------------------------------
# First-run setup (once, after `docker compose up -d`):
#   aws --endpoint-url http://localhost:4566 s3 mb s3://wprdc-etl-landing
#
# The `spatial` database and its postgis extension are created by the postgis
# image on first start — nothing to run by hand. Verify with:
#   docker compose exec postgis psql -U dagster -d spatial -c "SELECT PostGIS_Version();"
#
# .env for LOCAL DEV:
#   S3_ENDPOINT_URL=http://localhost:4566
#   AWS_ACCESS_KEY_ID=test
#   AWS_SECRET_ACCESS_KEY=test
#   AWS_REGION=us-east-1
#   LANDING_BUCKET=wprdc-etl-landing
#   WPRDC_LOCAL_SFTP=wprdc:wprdc          # matches the sftp service creds
#   POSTGIS_PORT=5434                     # host port for the postgis service
#   SPATIAL_DSN=postgresql://dagster:dagster@localhost:${POSTGIS_PORT}/spatial
#   CKAN_API_TOKEN=...                      # only if testing against real/local CKAN
#   # WPRDC_ETL_SINK_DIR=./_dryrun        # uncomment to skip CKAN and dump output locally
#
# A test source's defs.yaml would use:
#   source: { type: sftp, host: localhost, port: 2222,
#             path: /outbound/*.csv, secret_ref: WPRDC_LOCAL_SFTP }
# ---------------------------------------------------------------------------